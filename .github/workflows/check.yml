name: check

# Validates every skill where its files live and keeps the generated files fresh
# (index.json, .claude-plugin/marketplace.json, README sections). See AGENTS.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Poppler, for the PDF tests
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Unit tests
        run: python -m unittest discover tests
      - name: Skills valid at their sources, generated files up to date
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_index.py --check --remote
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Marketplace valid for Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.259
          claude plugin validate .
