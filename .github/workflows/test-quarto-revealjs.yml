name: test quarto-revealjs

# End-to-end test of the quarto-revealjs skill against the latest Quarto release: renders the
# fixture decks with the skill's assets and checks them offline, as PDF, and feature by feature
# against the guide. Weekly, so upstream changes (Quarto, its bundled reveal.js, plotly) show up
# here. A scheduled run that fails, or passes on versions newer than quarto-revealjs/versions.json,
# opens (or comments on) an issue. See quarto-revealjs/UPDATING.md.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays
  pull_request:
    paths:
      - "quarto-revealjs/**"
      - "tests/skills/quarto-revealjs/**"
      - ".github/workflows/test-quarto-revealjs.yml"
  workflow_dispatch:
    inputs:
      quarto-version:
        description: "Quarto release tag to test (e.g. v1.12.0); empty = latest"
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.test.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Quarto (latest release unless one is given), ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.quarto-version }}
        run: |
          # $TAG unquoted on purpose: empty means the latest release.
          gh release download $TAG --repo quarto-dev/quarto-cli \
            --pattern 'quarto-*-linux-amd64.deb' --output quarto.deb
          sudo apt-get update -q && sudo apt-get install -y -q ./quarto.deb ffmpeg
          quarto --version
      - name: Python packages (latest, to catch upstream changes)
        run: |
          python -m pip install --quiet plotly jupyter playwright
          python -m playwright install --with-deps chromium webkit   # headless only
      - name: Test the skill
        id: test
        run: tests/skills/quarto-revealjs/run.sh "$RUNNER_TEMP/deck"
      - name: Keep the rendered decks, PDF and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarto-revealjs-output
          path: ${{ runner.temp }}/deck/_output

  remind:
    # Only this job can write issues; it runs no repository code.
    needs: test
    if: always() && github.event_name == 'schedule' && (needs.test.result == 'failure' || needs.test.outputs.drift == 'true')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="quarto-revealjs: weekly test needs attention (upstream change)"
          if [ "$RESULT" = failure ]; then what="failed"; else what="passed on versions newer than quarto-revealjs/versions.json"; fi
          body="The weekly test of the quarto-revealjs skill $what: $RUN_URL. Follow quarto-revealjs/UPDATING.md."
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
