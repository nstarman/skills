<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Fixture explorer</title>
<style>
  /* Like a figpress-apps build: dark with the system unless <html data-theme> pins a theme. */
  :root { --bg: #ffffff; --fg: #222222; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15181d; --fg: #e3e6ea; } }
  :root[data-theme="dark"] { --bg: #15181d; --fg: #e3e6ea; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  .fk-app { padding: 8px; background: var(--bg); }
</style>
</head>
<body>
<div class="fk-app">
  <p>Drag to turn the square.</p>
  <canvas id="c" width="600" height="400"></canvas>
</div>
<script>
  // A stand-in for an interactive figure: a canvas that redraws when dragged.
  const c = document.getElementById("c"), g = c.getContext("2d");
  let angle = 0.3, drag = null;
  function draw() {
    g.clearRect(0, 0, c.width, c.height);
    g.save(); g.translate(300, 200); g.rotate(angle);
    g.fillStyle = "#0072B2"; g.fillRect(-80, -80, 160, 160); g.restore();
    window.__draws = (window.__draws || 0) + 1;
  }
  c.addEventListener("pointerdown", (e) => { drag = e.clientX; c.setPointerCapture(e.pointerId); });
  c.addEventListener("pointermove", (e) => { if (drag !== null) { angle += (e.clientX - drag) / 100; drag = e.clientX; draw(); } });
  c.addEventListener("pointerup", () => { drag = null; });
  draw();
</script>
</body>
</html>
