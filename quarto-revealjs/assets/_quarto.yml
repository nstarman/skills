project:
  output-dir: _output            # `make` (qd export) replaces this folder as a whole

format:
  revealjs:
    embed-resources: true        # each deck is one self-contained HTML file
    slide-number: true
    transition: slide
    background-transition: fade
    css: _talk/style/presentation.css
    include-after-body:
      - _talk/html/skip-steps.html     # "]": skip to the last step of a slide
      - _talk/html/notes-below.html    # ?preview: the slide's notes below it, while building
    pdf-max-pages-per-slide: 1
# No html-math-method or MathJax header: `qd export` adds both (one local MathJax 3.2.2, plus
# plotly.js when the deck has Python Plotly cells). Setting `url: "about:blank"` here would make
# qd skip its header, and the deck would have no MathJax.
